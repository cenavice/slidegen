<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slidegen</title>
<style>
  :root {
    --bg:#eef1f4; --panel:#ffffff; --border:#d4dae0; --fg:#15202b; --muted:#52606d;
    --accent:#1a6b4a; --accent-fg:#ffffff; --line:#e1e5ea; --err:#c0392b; --input:#f7f9fa;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 "Segoe UI", "Helvetica Neue", Arial, sans-serif; height:100vh; display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:16px; padding:14px 28px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { font-size:24px; margin:0; font-weight:700; letter-spacing:.02em; }
  header h1 span { color:var(--accent); }
  .spacer { flex:1; }
  #dot { width:11px; height:11px; border-radius:50%; background:var(--err); box-shadow:0 0 0 3px rgba(192,57,43,.15); }
  #dot.on { background:#1a6b4a; box-shadow:0 0 0 3px rgba(26,107,74,.18); }

  button, .ghost { border-radius:8px; font:inherit; cursor:pointer; }
  .primary { background:var(--accent); color:var(--accent-fg); font-weight:600; border:0; padding:12px 20px; font-size:16px; }
  .primary:disabled { opacity:.5; cursor:wait; }
  .ghost { background:#fff; color:var(--fg); border:1px solid var(--border); padding:9px 16px; font-size:15px; font-weight:500; }
  .ghost:hover { border-color:#9aa6b1; background:var(--input); }

  #workspace { flex:1; display:grid; grid-template-columns:440px 1fr; min-height:0; }
  aside { border-right:1px solid var(--border); padding:28px; display:flex; flex-direction:column; gap:16px; overflow-y:auto; background:var(--panel); }

  label { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--fg); margin-bottom:6px; display:block; }
  textarea, select, input {
    background:var(--panel); color:var(--fg); border:1px solid #b7c0c9; border-radius:8px;
    padding:11px 12px; font:15px/1.4 inherit; width:100%;
  }
  textarea:focus, select:focus, input:focus { outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
  textarea { resize:vertical; min-height:200px; flex:1; }
  #status { font-size:14px; color:var(--muted); min-height:1.2em; white-space:pre-wrap; font-weight:500; }
  #error { font-size:14px; color:var(--err); white-space:pre-wrap; font-weight:600; }

  .section { display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:8px; }
  .row input, .row select { flex:1; }
  .row button { width:auto; padding:10px 14px; white-space:nowrap; }
  .model-menu {
    position:absolute; top:100%; left:0; right:0; z-index:10;
    max-height:240px; overflow-y:auto; margin-top:2px;
    background:var(--panel); border:1px solid #b7c0c9; border-radius:8px;
    box-shadow:0 4px 12px rgba(20,35,50,.12);
  }
  .model-menu:empty { display:none; }
  .model-menu .model-option { padding:8px 12px; font-size:14px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .model-menu .model-option:hover, .model-menu .model-option.active { background:var(--accent); color:var(--accent-fg); }

  main { position:relative; }
  iframe { width:100%; height:100%; border:0; background:#000; }
  #placeholder { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:17px; font-weight:500; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #overlay { position:absolute; inset:0; z-index:5; background:rgba(255,255,255,.8); backdrop-filter:blur(2px); display:none; place-items:center; }
  #overlayText { color:var(--fg); font-size:16px; font-weight:600; }
  .toolbar { position:absolute; top:14px; right:14px; display:none; gap:10px; z-index:2; align-items:center; }
  .toolbar > * { font-size:13px; padding:9px 12px; line-height:1.3; }
  .toolbar label { text-transform:none; letter-spacing:0; display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid #b7c0c9; border-radius:8px; cursor:pointer; box-shadow:0 1px 3px rgba(21,32,43,.08); margin:0; }
  .toolbar label input[type="checkbox"] { width:16px; height:16px; padding:0; margin:0; accent-color:var(--accent); }
  #filmstrip { position:absolute; left:14px; top:64px; bottom:14px; width:300px; display:none; overflow-y:auto; z-index:3; background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px; box-shadow:0 2px 8px rgba(21,32,43,.12); }

  /* history */
  #histWrap { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  #histList { width:100%; padding:10px; font-size:14px; }
  .hrow { display:flex; gap:10px; }
  .hrow button { flex:1; font-size:14px; padding:10px; }
  #histDel { color:var(--err); border-color:#e4b6b0; }

  /* settings modal */
  dialog.sheet { border:1px solid var(--border); border-radius:12px; padding:0; width:min(480px,94vw); background:var(--panel); color:var(--fg); box-shadow:0 8px 32px rgba(21,32,43,.2); }
  dialog.sheet::backdrop { background:rgba(21,32,43,.45); }
  .sheet .inner { padding:26px; display:flex; flex-direction:column; gap:14px; max-height:88vh; overflow-y:auto; }
  .sheet h2 { font-size:19px; font-weight:700; margin:0; padding-bottom:12px; border-bottom:2px solid var(--line); }
  .sheet .actions { display:flex; gap:10px; justify-content:flex-end; padding:16px 26px; border-top:1px solid var(--line); }
  .sheet .actions button { padding:10px 20px; font-size:15px; }
  details summary { cursor:pointer; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--fg); }

  .card { border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:12px; box-shadow:0 1px 3px rgba(21,32,43,.06); }
  .card .meta { font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; }
  .card .ops { display:flex; gap:6px; margin-top:8px; }
  .card .ops ~ .fix, .card > .fix { display:block; width:100%; margin-top:6px; background:var(--accent); color:var(--accent-fg); font-weight:600; font-size:13px; padding:9px 10px; border-radius:8px; border:0; cursor:pointer; white-space:nowrap; overflow:hidden; }
  .card .thumb { border-radius:6px; width:100%!important; aspect-ratio:16/9; display:block; }
  #filmstrip { width:340px; }
  .card .ops { display:grid; grid-template-columns:34px 34px 34px 34px 34px 34px; gap:6px; margin-top:8px; }
  .card .ops .fix { grid-column:1 / -1; background:var(--accent); color:var(--accent-fg); font-weight:600; font-size:13px; padding:8px 10px; border-radius:8px; border:0; cursor:pointer; white-space:nowrap; overflow:hidden; }
  .card .ops .fix:disabled { opacity:.5; cursor:wait; }
  .card .ops .icon { width:34px; height:34px; padding:0; background:#fff; color:var(--fg); border:1px solid #b7c0c9; font-size:14px; border-radius:8px; cursor:pointer; }
  .card .ops .icon:disabled { opacity:.4; cursor:wait; }

  /* edit modal */
  dialog#editDlg { border:1px solid var(--border); border-radius:12px; padding:0; width:min(600px,94vw); background:var(--panel); color:var(--fg); box-shadow:0 8px 32px rgba(21,32,43,.2); }
  #editDlg::backdrop { background:rgba(21,32,43,.45); }
  #editDlg .body { padding:22px 24px; display:flex; flex-direction:column; gap:14px; }
  #editDlg h2 { font-size:19px; font-weight:700; margin:0; }
  #editDlg .pvwrap { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  #editDlg .pv { border:1px solid var(--border); border-radius:8px; overflow:hidden; display:none; }
  #editDlg .pv .tag { font-size:12px; font-weight:600; color:var(--muted); padding:6px 10px; background:var(--input); }
  #editDlg .pv iframe { width:100%; aspect-ratio:16/9; border:0; background:#fff; display:block; pointer-events:none; }
  #editDlg textarea { min-height:96px; }
  #editDlg .acts { display:flex; gap:10px; justify-content:flex-end; }
  #editDone { text-align:center; padding:6px 0; }
  #editDone .big { font-size:20px; font-weight:700; color:var(--accent); margin-bottom:8px; }
  #editDone iframe { width:100%; aspect-ratio:16/9; border:1px solid var(--border); border-radius:8px; background:#fff; display:block; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>slide<span>gen</span></h1>
  <div id="dot" title="provider not configured"></div>
  <div class="spacer"></div>
  <button class="ghost" id="openSettings">⚙ Settings</button>
</header>

<div id="workspace">
  <aside>
    <div class="section">
      <label>Design system</label>
      <div id="preset" role="radiogroup" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
    <div class="section">
      <label for="model">Model</label>
      <div class="row" style="position:relative;">
        <input id="model" autocomplete="off" spellcheck="false" placeholder="gpt-4o-mini">
        <button class="ghost" id="loadModels" title="Load the model list from your provider">↻</button>
        <!-- Dropdown menu — populated from POST /models, filtered by what you type. -->
        <div id="modelMenu" class="model-menu" hidden></div>
      </div>
    </div>
    <div class="section" style="flex:1;">
      <label for="prompt">Brief</label>
      <textarea id="prompt" placeholder="Topic, audience, language, structure, slide count…"></textarea>
    </div>
    <div class="section">
      <button class="primary" id="go" autocomplete="off">Generate deck</button>
      <button class="ghost" id="cancel" style="color:var(--err);display:none;">✕ Cancel</button>
      <div id="status"></div>
      <div id="error"></div>
    </div>
    <details>
      <summary>History</summary>
      <div id="histWrap">
        <select id="histList"></select>
        <div class="hrow">
          <button class="ghost" id="histOpen">Open</button>
          <button class="ghost" id="histDel">Delete</button>
        </div>
      </div>
    </details>
  </aside>

  <main>
    <div id="overlay">
      <div style="text-align:center;">
        <div style="width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite;"></div>
        <div id="overlayText">generating…</div>
      </div>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="ghost" id="download" style="display:none">Download .html</button>
      <button class="ghost" id="pdf" style="display:none">Download PDF</button>
      <button class="ghost" id="open" style="display:none">Open full</button>
      <label><input type="checkbox" id="editMode"> Edit slides</label>
    </div>
    <div id="filmstrip"></div>
    <iframe id="stage" title="deck preview" sandbox="allow-scripts"></iframe>
    <div id="placeholder">generative preview will appear here</div>
  </main>
</div>

<dialog class="sheet" id="settings">
  <form method="dialog" style="display:flex;flex-direction:column;height:100%;">
    <div class="inner">
      <h2>Credentials</h2>
      <div class="section">
        <label for="baseUrl">Provider URL (OpenAI-compatible base)</label>
        <input id="baseUrl" placeholder="https://api.openai.com/v1">
      </div>
      <div class="section">
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" placeholder="sk-...">
      </div>
      <div class="section">
        <label for="headers">Custom headers (JSON)</label>
        <textarea id="headers" style="min-height:64px;font:13px/1.4 monospace;" placeholder='{"x-api-version":"2024-01"}'></textarea>
      </div>
      <div class="section">
        <label>Default design system</label>
        <div role="radiogroup" id="presetDefault" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" type="button" id="closeSettings">Cancel</button>
      <button class="primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="editDlg">
  <form method="dialog" style="display:flex;flex-direction:column;">
    <div class="body">
      <h2 id="editTitle">Fix slide 1</h2>
      <div id="editPreview" class="pvwrap">
        <div class="pv" id="pvOld" style="display:block;">
          <div class="tag">current</div>
          <iframe id="pvOldFrame" title="current slide"></iframe>
        </div>
        <div class="pv" id="pvNew">
          <div class="tag">preview of updated deck</div>
          <iframe id="pvNewFrame" title="updated deck"></iframe>
        </div>
      </div>
      <textarea id="editText" placeholder="What should change on this slide?"></textarea>
      <div class="acts" id="editActs">
        <button class="ghost" type="button" id="editClose">Cancel</button>
        <button class="primary" type="submit" id="editGo">Update slide</button>
      </div>
      <div id="editDone" style="display:none;">
        <div class="big">Slide updated ✓</div>
        <iframe id="editDoneFrame" title="updated slide"></iframe>
        <div class="acts" style="margin-top:12px;">
          <button class="ghost" type="button" id="editAgain" style="flex:1;">More edits</button>
          <button class="primary" type="button" id="editCloseDone" style="flex:1;">Done</button>
        </div>
      </div>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const PRESETS = [
  { id: "swiss", name: "Swiss / analytical", bg: "#f5f5f2", fg: "#111", accent: "#0033CC", title: "#111", desc: "Grid, hairlines, huge numbers, Klein blue." },
  { id: "editorial", name: "Warm editorial", bg: "#F7F3EE", fg: "#2b2620", accent: "#B4562C", title: "#1d1a15", desc: "Paper, serif display, pull-quotes, terracotta." },
  { id: "dark", name: "Midnight editorial", bg: "#0E1116", fg: "#e8e2d6", accent: "#D9A441", title: "#f4efe6", desc: "Near-black, gold accent, serif headlines." },
];
function presetValue(gid) { return document.querySelector(`#${gid} input:checked`)?.value || "swiss"; }
function setPreset(gid, v) { document.querySelector(`#${gid} input[value="${v}"]`).checked = true; }
function renderPresetPicker(gid) {
  const el = $(gid);
  el.innerHTML = PRESETS.map((p) => `
    <label style="display:flex;gap:12px;align-items:flex-start;border:2px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;background:#fff;">
      <input type="radio" name="preset-${gid}" value="${p.id}" style="width:auto;margin-top:22px;accent-color:var(--accent);">
      <svg width="84" height="52" viewBox="0 0 84 52" style="border-radius:4px;flex-shrink:0;border:1px solid var(--border);" aria-hidden="true">
        <rect width="84" height="52" fill="${p.bg}"/>
        <rect x="9" y="9" width="40" height="6" rx="2" fill="${p.title}"/>
        <rect x="9" y="21" width="30" height="3" rx="1.5" fill="${p.fg}" opacity=".75"/>
        <rect x="9" y="27" width="34" height="3" rx="1.5" fill="${p.fg}" opacity=".55"/>
        <rect x="9" y="33" width="26" height="3" rx="1.5" fill="${p.fg}" opacity=".55"/>
        <circle cx="68" cy="36" r="9" fill="${p.accent}"/>
      </svg>
      <span>
        <strong style="font-size:15px;">${p.name}</strong><br>
        <span style="font-size:13px;color:var(--muted);">${p.desc}</span>
      </span>
    </label>`).join("");
  setPreset(gid, el.dataset.pick || "swiss");
}
const SETTINGS_KEY = "slidegen-settings";
const fields = ["baseUrl", "apiKey", "headers", "model"];
const pick = (gid, v) => { $(gid).dataset.pick = v || "swiss"; renderPresetPicker(gid); };
pick("preset"); pick("presetDefault");
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
  fields.forEach((f) => { if (saved[f]) $(f).value = saved[f]; });
  if (saved.presetDefault) { pick("preset", saved.presetDefault); pick("presetDefault", saved.presetDefault); }
  if (!$("baseUrl").value) $("baseUrl").value = "https://api.openai.com/v1";
  // No default custom headers — most OpenAI-compatible endpoints only need the API key.
} catch {}
function saveSettings() {
  const d = Object.fromEntries(fields.map((f) => [f, $(f).value]));
  d.presetDefault = presetValue("presetDefault");
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(d));
}

const settingsDlg = $("settings");
$("openSettings").addEventListener("click", () => { setPreset("presetDefault", presetValue("preset")); settingsDlg.showModal(); });
$("closeSettings").addEventListener("click", () => settingsDlg.close());
settingsDlg.addEventListener("close", () => { setPreset("preset", presetValue("presetDefault")); saveSettings(); paintDot(); });
fields.forEach((f) => $(f).addEventListener("change", saveSettings));
function paintDot() { $("dot").classList.toggle("on", !!$("apiKey").value.trim()); $("dot").title = $("apiKey").value.trim() ? "provider configured" : "no api key — open settings"; }
paintDot();

function providerPayload() {
  let headers = {};
  try { headers = JSON.parse($("headers").value || "{}"); }
  catch { $("error").textContent = "custom headers is not valid JSON"; }
  return { baseUrl: $("baseUrl").value.trim(), apiKey: $("apiKey").value.trim(), headers };
}
async function fetchJSON(url, payload, signal) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
let tick = null;
const BUSY_DISABLE = ["loadModels", "histOpen", "histDel", "download", "pdf", "open"];
function loading(on, text) {
  BUSY_DISABLE.forEach((id) => ($(id).disabled = on));
  $("editMode").disabled = on;
  $("overlay").style.display = on ? "grid" : "none";
  if (on) {
    $("go").disabled = true; $("go").blur();
    $("cancel").style.display = "inline-block";
    const s0 = Date.now(), label = text || "generating";
    $("overlayText").textContent = label + " 0s";
    tick = setInterval(() => $("overlayText").textContent = label + ` ${Math.round((Date.now() - s0) / 1000)}s`, 1000);
  } else {
    clearInterval(tick); tick = null;
    $("go").disabled = false;
    $("cancel").style.display = "none";
  }
}
const ACTIVE_JOB_KEY = "slidegen-active-job";
let jobPoll = null;
let ctrl = null; // in-flight slide edit (separate from generation, which is server-side)
$("cancel").addEventListener("click", () => {
  if (ctrl) { ctrl.abort(); return; }
  const id = localStorage.getItem(ACTIVE_JOB_KEY);
  if (id) fetch(`/generate/${id}/cancel`, { method: "POST" }).catch(() => {});
});
window.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (ctrl) { ctrl.abort(); return; }                       // cancel a slide edit
  if (document.querySelector("dialog[open]")) return;       // let the dialog close itself
  const id = localStorage.getItem(ACTIVE_JOB_KEY);
  if (id) $("cancel").click();
});

// ─── model picker: a small combobox (type to search the provider's list, or type any name) ───
let modelNames = [];
let modelHighlight = -1; // keyboard-selected option index, -1 = none

// Fetch the model list from the provider and open the dropdown.
async function loadModels() {
  $("loadModels").disabled = true;
  $("status").textContent = "loading model list…";
  try {
    const d = await fetchJSON("/models", { provider: providerPayload() });
    modelNames = d.models.map(String);
    $("status").textContent = `${d.models.length} models loaded`;
    saveSettings();
    renderModelMenu($("model").value);
  } catch (e) {
    $("status").textContent = ""; $("error").textContent = String(e.message || e);
  } finally {
    $("loadModels").disabled = false;
  }
}

// Rebuild the dropdown's options, showing only models matching the typed prefix.
function renderModelMenu(filterText) {
  modelHighlight = -1;
  const query = filterText.toLowerCase();
  const matches = modelNames.filter((name) => name.toLowerCase().includes(query));
  const picked = $("model").value;
  $("modelMenu").innerHTML = matches.map((name) =>
    `<div class="model-option${name === picked ? " active" : ""}" data-value="${name.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;")}">${name.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>`
  ).join("");
  $("modelMenu").hidden = matches.length === 0;
}

// Choosing an option: fill the field, close the menu.
function pickModel(name) {
  $("model").value = name;
  $("modelMenu").hidden = true;
  saveSettings();
}

$("modelMenu").addEventListener("mousedown", (e) => {
  // mousedown (not click) so the input doesn't blur/close the menu first
  const option = e.target.closest(".model-option");
  if (option) { e.preventDefault(); pickModel(option.dataset.value); }
});

// Open the menu on focus/click, closing only when the field loses focus to something else.
$("model").addEventListener("focus", async () => {
  if (!modelNames.length) await loadModels();
  renderModelMenu($("model").value);
});
$("model").addEventListener("input", () => renderModelMenu($("model").value));
$("model").addEventListener("blur", () => { $("modelMenu").hidden = true; });
$("model").addEventListener("keydown", (e) => {
  const options = [...$("modelMenu").children];
  if (!options.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    modelHighlight = Math.min(Math.max(modelHighlight + (e.key === "ArrowDown" ? 1 : -1), 0), options.length - 1);
    options.forEach((el, i) => el.classList.toggle("active", i === modelHighlight));
    options[modelHighlight]?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter" && options[modelHighlight]) {
    e.preventDefault();
    pickModel(options[modelHighlight].dataset.value);
  } else if (e.key === "Escape") {
    $("modelMenu").hidden = true;
  }
});
$("loadModels").addEventListener("click", async () => {
  await loadModels();
  $("model").focus();
});

$("go").addEventListener("click", async () => {
  $("error").textContent = "";   saveSettings(); paintDot();
  loading(true, "generating");
  try {
    lastBrief = $("prompt").value;
    const r = await fetch("/generate", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: $("prompt").value,
        preset: presetValue("preset"),
        provider: { ...providerPayload(), model: $("model").value.trim() },
      }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    watchJob(d.id);
  } catch (e) {
    loading(false);
    $("error").textContent = e.message || "network error";
  }
});

// Generation runs server-side and keeps going when the page is refreshed: the job
// id is stored locally and polled. On load we reattach to any job still in flight.
function watchJob(id) {
  localStorage.setItem(ACTIVE_JOB_KEY, id);
  loading(true, "generating");
  clearInterval(tick); tick = null; // the poll owns the overlay text
  clearInterval(jobPoll);
  jobPoll = setInterval(pollJob, 1000);
  pollJob();
}
let pollBusy = false;
async function pollJob() {
  if (pollBusy) return;
  const id = localStorage.getItem(ACTIVE_JOB_KEY);
  if (!id) return stopPoll();
  pollBusy = true;
  let d;
  try {
    const r = await fetch(`/generate/${id}`);
    d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
  } catch (e) {
    pollBusy = false;
    if (/unknown job/i.test(e.message || "")) { stopPoll(); $("error").textContent = "generation lost (server restarted) — please retry"; }
    return; // transient network error — keep polling
  }
  pollBusy = false;
  if (d.phase === "queued") $("overlayText").textContent = `queued… position ${d.queuePosition || 1}`;
  else if (d.phase === "running") $("overlayText").textContent = `generating… ${(d.chars || 0).toLocaleString()} chars · ${d.seconds || 0}s`;
  else if (d.phase === "done") { stopPoll(); showDeck(d.html); pushHistory(d.html); setDoneStatus(d.issues || []); }
  else if (d.phase === "error") { stopPoll(); $("error").textContent = d.error || "generation failed"; }
  else if (d.phase === "cancelled") { stopPoll(); $("status").textContent = "cancelled"; }
}
function stopPoll() { clearInterval(jobPoll); jobPoll = null; localStorage.removeItem(ACTIVE_JOB_KEY); loading(false); }
function setDoneStatus(warns) {
  $("status").textContent = warns.length
    ? `done — ⚠ ${warns.map((w) => `slide ${w.slide}: ${w.msg}`).join(" · ")}`.slice(0, 220)
    : "done — arrows to navigate the deck";
}
(function resumeJob() { const id = localStorage.getItem(ACTIVE_JOB_KEY); if (id) watchJob(id); })();

let lastDeck = null, lastBrief = "";
function showDeck(html) {
  lastDeck = html;
  $("stage").srcdoc = html;
  $("placeholder").style.display = "none";
  $("toolbar").style.display = "flex";
  $("download").style.display = "inline-block";
  $("pdf").style.display = "inline-block";
  $("open").style.display = "inline-block";
  $("filmstrip").style.display = $("editMode").checked ? "block" : "none";
  refreshStrip();
}
$("download").addEventListener("click", () => {
  if (!lastDeck) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lastDeck], { type: "text/html" }));
  a.download = "deck.html"; a.click();
});
$("open").addEventListener("click", () => {
  if (!lastDeck) { $("error").textContent = "generate or load a deck first"; return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lastDeck], { type: "text/html" }));
  a.target = "_blank"; a.rel = "noopener"; a.click();
});
$("pdf").addEventListener("click", async () => {
  if (!lastDeck) return;
  $("error").textContent = ""; $("pdf").disabled = true;
  const prev = $("status").textContent;
  $("status").textContent = "rendering PDF… (needs the container)";
  try {
    const r = await fetch("/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ html: lastDeck }) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || r.statusText); }
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = "deck.pdf"; a.click();
    URL.revokeObjectURL(url);
    $("status").textContent = "PDF downloaded";
  } catch (e) {
    $("status").textContent = prev; $("error").textContent = e.message || String(e);
  } finally { $("pdf").disabled = false; }
});

// ─── history (localStorage, per browser) ─────────────────────────────
const HISTORY_KEY = "slidegen-history";
const HISTORY_MAX = 15;
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch { return []; } }
function deckTitle(html) {
  try {
    const d = new DOMParser().parseFromString(html, "text/html");
    return (d.querySelector("section h1,section h2,section h3")?.textContent || "").trim().slice(0, 54)
      || "(untitled)";
  } catch { return "(untitled)"; }
}
function pushHistory(html) {
  if (!html) return;
  const h = loadHistory();
  h.unshift({ ts: Date.now(), title: deckTitle(html), html });
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX)));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  $("histList").innerHTML = h.map((e, i) =>
    `<option value="${i}">${new Date(e.ts).toLocaleString()} — ${e.title}</option>`).join("");
  $("histList").selectedIndex = -1;
}
$("histOpen").addEventListener("click", () => {
  const item = loadHistory()[+$("histList").value];
  if (!item) { $("error").textContent = "select a history item first"; return; }
  showDeck(item.html);
  lastBrief = "";
  $("status").textContent = "loaded from history — ✎ fix works here too (brief context empty)";
});
$("histDel").addEventListener("click", () => {
  const i = +$("histList").value;
  if (i < 0) return;
  const h = loadHistory();
  h.splice(i, 1);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  renderHistory();
});
renderHistory();

// ─── slide editing ─────────────────────────────────────────────────────
const STRIP = $("filmstrip");

$("editMode").addEventListener("change", () => {
  STRIP.style.display = $("editMode").checked ? "block" : "none";
  if ($("editMode").checked) refreshStrip();
});

function parseSlides() {
  const doc = new DOMParser().parseFromString(lastDeck, "text/html");
  const secs = [...doc.querySelectorAll("section")].filter((s) => (s.className || "").includes("slide"));
  return { doc, secs, style: [...doc.querySelectorAll("style")].map((s) => s.textContent).join("\\n") };
}

function saveDeckFromDoc(doc) {
  lastDeck = "<!doctype html>\n" + doc.documentElement.outerHTML;
  $("stage").srcdoc = lastDeck;
  refreshStrip();
  fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ html: lastDeck }) }).catch(() => {});
}

$("editText").style.display = "none";
$("editClose").addEventListener("click", () => { editCtx = null; editDlg.close(); });
$("editCloseDone").addEventListener("click", () => { editCtx = null; editDlg.close(); });
$("editAgain").addEventListener("click", () => { if (editCtx) { editDlg.close(); openEditDlg("regen", editCtx.act.startsWith("ins") ? (editCtx.act === "ins_before" ? editCtx.i : editCtx.i + 1) : editCtx.i); } });

async function performEdit(i, act, instruction) {
  const { doc, secs, style } = parseSlides();
  ctrl = new AbortController();
  STRIP.querySelectorAll("button, input").forEach((el) => (el.disabled = true));
  $("go").disabled = true;
  try {
    const section = await callEdit(secs.map((s) => s.outerHTML), i, act, instruction, ctrl.signal, style);
    const tpl = document.createElement("template");
    tpl.innerHTML = section;
    const clean = tpl.content.querySelector("section");
    if (!clean) throw new Error("no <section> in model output. Raw: " + section.slice(0, 200));
    const slideStyle = tpl.content.querySelector("style");
    if (slideStyle) clean.prepend(slideStyle);
    if (act === "regen") secs[i].replaceWith(clean);
    else if (act === "ins_before") secs[i].before(clean);
    else secs[i].after(clean);
    saveDeckFromDoc(doc);
    pvShot(doc.documentElement.outerHTML, act === "regen" ? i : (act === "ins_before" ? i : i + 1), "pvNewFrame");
    $("pvOld").style.display = editCtx.act === "regen" ? "block" : "none";
    $("pvNew").style.display = "block";
    $("editDone").style.display = "block";
    $("editPreview").style.display = "grid";
    $("editActs").style.display = "none";
    $("editText").style.display = "none";
    pushHistory(lastDeck);
    $("status").textContent = "slide updated";
  } catch (e) {
    $("status").textContent = e.name === "AbortError" ? "cancelled" : "";
    if (e.name !== "AbortError") $("error").textContent = e.message || String(e);
    editDlg.close();
  } finally {
    ctrl = null;
    STRIP.querySelectorAll("button, input").forEach((el) => (el.disabled = false));
  }
}
async function callEdit(slides, index, action, instruction, signal, style) {
  return fetchJSON("/edit", {
    prompt: lastBrief, preset: presetValue("preset"),
    provider: { ...providerPayload(), model: $("model").value.trim() },
    slides, index, action, instruction, style,
  }, signal).then((d) => d.section);
}

function refreshStrip() {
  if (!lastDeck) return;
  const { doc, secs } = parseSlides();
  STRIP.innerHTML = "";
  secs.forEach((s, i) => {
    const title = (s.querySelector("h1,h2,h3,h4,[class*=title]")?.textContent || "").trim().slice(0, 38);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="meta">slide ${i + 1} · ${title || "(untitled)"}</div>
      <iframe class="thumb" sandbox="allow-scripts" style="width:100%;aspect-ratio:16/9;border:0;background:#fff;pointer-events:none;" title="thumb ${i + 1}"></iframe>
      <div class="ops">
        <button class="icon" data-act="ins_before" title="Insert new slide before">＋</button>
        <button class="icon" data-act="ins_after" title="Insert new slide after">＋＋</button>
        <button class="icon" data-act="up" title="Move up">↑</button>
        <button class="icon" data-act="down" title="Move down">↓</button>
        <button class="icon" data-act="del" title="Delete slide">🗑</button>
      </div>
      <button class="fix" data-act="regen">✎ Fix this slide</button>`;
    STRIP.appendChild(card);
    const thumbDoc = doc.documentElement.cloneNode(true);
    const all = [...thumbDoc.querySelectorAll("section")];
    all.forEach((n, j) => { if (j !== i) n.remove(); });
    [...thumbDoc.querySelectorAll("script")].forEach((n) => n.remove());
    card.querySelector(".thumb").srcdoc = `<!doctype html>${thumbDoc.outerHTML}`;
    card.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => stripAction(b.dataset.act, i)));
  });
}

function stripAction(act, i) {
  if (act === "del") {
    if (!confirm(`Delete slide ${i + 1}?`)) return;
    const { doc, secs } = parseSlides();
    secs[i].remove();
    saveDeckFromDoc(doc);
    pushHistory(lastDeck);
    return;
  }
  if (act === "up" || act === "down") {
    const { doc, secs } = parseSlides();
    const j = act === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= secs.length) return;
    const order = secs.map((s) => s.cloneNode(true));
    const moved = order.splice(i, 1)[0];
    order.splice(j, 0, moved);
    secs[0].parentNode.replaceChildren(...order);
    saveDeckFromDoc(doc);
    pushHistory(lastDeck);
    return;
  }
  openEditDlg(act, i);
}

// ── edit modal ──
let editCtx = null; // { i, act, card }
const editDlg = $("editDlg");
function pvShot(html, i, frameId) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const all = [...doc.querySelectorAll("section")];
  all.forEach((n, j) => { if (j !== i) n.remove(); });
  [...doc.querySelectorAll("script")].forEach((n) => n.remove());
  $(frameId).srcdoc = "<!doctype html>" + doc.documentElement.outerHTML;
}
function openEditDlg(act, i) {
  if (!lastDeck) { $("error").textContent = "generate or load a deck first"; return; }
  editCtx = { act, i };
  const { doc } = parseSlides();
  $("editTitle").textContent = act === "regen" ? `Fix slide ${i + 1}` : `Insert slide ${act === "ins_before" ? "before" : "after"} slide ${i + 1}`;
  $("editGo").textContent = act === "regen" ? "Update slide" : "Create slide";
  pvShot(doc.documentElement.outerHTML, i, "pvOldFrame");
  $("pvOld").style.display = "block";
  $("pvNew").style.display = "none";
  $("editText").value = "";
  $("editText").style.display = "block";
  $("editDone").style.display = "none";
  $("editPreview").style.display = "grid";
  $("editActs").style.display = "flex";
  editDlg.showModal();
}
editDlg.querySelector("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!editCtx || editCtx.busy) return;
  const instruction = $("editText").value.trim();
  if (!instruction) { $("editText").focus(); return; }
  editCtx.busy = true;
  $("editGo").disabled = true;
  performEdit(editCtx.i, editCtx.act, instruction).finally(() => { editCtx.busy = false; $("editGo").disabled = false; });
});
</script>
