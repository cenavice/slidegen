<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slidegen</title>
<style>
  :root { --bg: #0e1116; --fg: #f2ede4; --accent: #d97706; --line: #2a2f38; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { padding: 24px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.05em; }
  h1 span { color: var(--accent); }
  textarea { min-height: 220px; resize: vertical; background: #161b22; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; }
  label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: #8b93a1; }
  select { background: #161b22; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  button { background: var(--accent); color: #111; font-weight: 600; border: 0; border-radius: 8px; padding: 12px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { font-size: 13px; color: #8b93a1; min-height: 1.2em; white-space: pre-wrap; }
  #error { color: #f87171; white-space: pre-wrap; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { position: relative; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  #placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #566070; font-size: 14px; }
  .toolbar { position: absolute; top: 12px; right: 12px; display: none; gap: 8px; z-index: 2; }
  .toolbar button { background: #161b22; color: var(--fg); border: 1px solid var(--line); font-size: 13px; padding: 8px 12px; }
</style>
</head>
<body>
<aside>
  <h1>slide<span>gen</span></h1>
  <details open>
    <summary style="cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">provider settings</summary>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">provider url (openai-compatible base)</label>
      <input id="baseUrl" style="background:#161b22; color:#f2ede4; border:1px solid #2a2f38; border-radius:8px; padding:8px; font:inherit;" placeholder="https://opencode.ai/zen/go/v1">
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">api key</label>
      <input id="apiKey" type="password" style="background:#161b22; color:#f2ede4; border:1px solid #2a2f38; border-radius:8px; padding:8px; font:inherit;" placeholder="sk-...">
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">custom headers (JSON)</label>
      <textarea id="headers" style="min-height:64px; background:#161b22; color:#f2ede4; border:1px solid #2a2f38; border-radius:8px; padding:8px; font:12px monospace;" placeholder='{"x-opencode-session":"my-session"}'></textarea>
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">model</label>
      <div style="display:flex; gap:8px;">
        <input id="model" list="modelList" style="flex:1; background:#161b22; color:#f2ede4; border:1px solid #2a2f38; border-radius:8px; padding:8px; font:inherit;" placeholder="mimo-v2.5">
        <datalist id="modelList"></datalist>
        <button id="loadModels" style="background:#161b22; color:#f2ede4; border:1px solid #2a2f38; padding:8px 10px; font-size:13px; cursor:pointer;">↻ list</button>
      </div>
      <label style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">search api key (tavily — for research grounding)</label>
      <input id="searchKey" type="password" data-setting="searchKey" style="background:#161b22; color:#f2ede4; border:1px solid #2a2f38; border-radius:8px; padding:8px; font:inherit;" placeholder="tvly-...">
    </div>
  </details>
  <label for="preset">design system</label>
  <select id="preset">
    <option value="swiss">Swiss / analytical</option>
    <option value="editorial">Warm editorial</option>
    <option value="dark">Midnight editorial</option>
  </select>
  <label for="prompt">brief</label>
  <textarea id="prompt" placeholder="Paste your full brief here: topic, audience, language, structure, slide count..."></textarea>
  <button id="go" autocomplete="off">Generate deck</button>
  <details>
    <summary style="cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:#8b93a1;">history (this browser)</summary>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
      <select id="histList" style="background:#161b22; color:#f2ede4; border:1px solid #2a2f38; border-radius:8px; padding:6px; font-size:12px;"></select>
      <div style="display:flex; gap:6px;">
        <button id="histOpen" style="font-size:12px; padding:6px 10px;">Open</button>
        <button id="histDel" style="font-size:12px; padding:6px 10px; background:#161b22; color:#f87171; border:1px solid #2a2f38;">Delete item</button>
      </div>
    </div>
  </details>
  <button id="cancel" style="display:none;background:#161b22;color:#f87171;border:1px solid #2a2f38;">✕ cancel</button>
  <div id="status"></div>
  <div id="error"></div>
</aside>
<main>
  <div id="overlay" style="display:none;position:absolute;inset:0;z-index:3;display:none;background:rgba(14,17,22,0.75);backdrop-filter:blur(2px);place-items:center;">
    <div style="text-align:center;">
      <div style="width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin 0.8s linear infinite;"></div>
      <div id="overlayText" style="color:#8b93a1;font-size:13px;">generating…</div>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
    <button id="download" style="display:none">Download .html</button>
    <button id="open" style="display:none">Open full</button>
    <label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#8b93a1;background:#161b22;border:1px solid #2a2f38;border-radius:8px;padding:8px 12px;cursor:pointer;">
      <input type="checkbox" id="editMode"> edit slides
    </label>
  </div>
  <div id="filmstrip" style="display:none;position:absolute;left:12px;top:60px;bottom:12px;width:300px;overflow-y:auto;z-index:3;background:rgba(14,17,22,0.94);border:1px solid #2a2f38;border-radius:10px;padding:10px;"></div>
  <iframe id="stage" title="deck preview"></iframe>
  <div id="placeholder">generative preview will appear here</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const SETTINGS_KEY = "slidegen-settings";
const fields = ["baseUrl", "apiKey", "headers", "model", "searchKey"];
try {
  const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
  fields.forEach((f) => { if (saved[f]) $(f).value = saved[f]; });
  if (!$("baseUrl").value) $("baseUrl").value = "https://opencode.ai/zen/go/v1";
  if (!$("headers").value) $("headers").value = '{"x-opencode-session":"slidegen-web"}';
} catch {}
function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.fromEntries(fields.map((f) => [f, $(f).value]))));
}
fields.forEach((f) => $(f).addEventListener("change", saveSettings));

function headersOf() {
  try { return JSON.parse($("headers").value || "{}"); }
  catch {
    $("error").textContent = "custom headers is not valid JSON";
    throw "bad headers";
  }
}
function providerPayload() {
  return { baseUrl: $("baseUrl").value.trim(), apiKey: $("apiKey").value.trim(), headers: headersOf() };
}
async function fetchJSON(url, payload, signal) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), signal });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
let tick = null;
function loading(on, text) {
  $("overlay").style.display = on ? "grid" : "none";
  if (on) {
    $("go").disabled = true;
    $("go").blur();
    $("cancel").style.display = "inline-block";
    const s0 = Date.now();
    $("overlayText").textContent = (text || "generating…") + " 0s";
    tick = setInterval(() => $("overlayText").textContent = (text || "generating…") + ` ${Math.round((Date.now() - s0) / 1000)}s`, 1000);
  } else {
    clearInterval(tick);
    $("go").disabled = false;
    $("cancel").style.display = "none";
  }
}
let ctrl = null;
$("cancel").addEventListener("click", () => { if (ctrl) ctrl.abort(); });
$("loadModels").addEventListener("click", async () => {
  try { headersOf(); } catch { return; }
  loadingModels(true);
  try {
    const r = await fetch("/models", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: providerPayload() }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    $("modelList").innerHTML = data.models.map((m) => `<option value="${m}">`).join("");
    $("status").textContent = `${data.models.length} models loaded — click the model field`;
    saveSettings();
  } catch (e) {
    $("error").textContent = String(e.message || e);
  } finally {
    loadingModels(false);
  }
});
function loadingModels(on) {
  $("loadModels").disabled = on; $("go").disabled = on;
  $("status").textContent = on ? "loading model list…" : "";
}
window.addEventListener("keydown", (e) => { if (e.key === "Escape" && ctrl) ctrl.abort(); });
$("go").addEventListener("click", async () => {
  $("error").textContent = ""; saveSettings();
  try { headersOf(); } catch { return; }
  if (!$("apiKey").value.trim()) { $("error").textContent = "api key required"; return; }
  ctrl = new AbortController();
  loadingModels(false); loading(true, "generating");
  try {
    const r = await fetch("/generate", { method: "POST", headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        prompt: $("prompt").value,
        preset: $("preset").value,
        provider: { ...providerPayload(), model: $("model").value.trim() },
      }) });
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || r.statusText); }
    // NDJSON progress stream: {phase:"progress",chars,seconds} … {phase:"done",html} | {phase:"error",error}
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", html = "", errMsg = null;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.phase === "progress") {
          $("overlayText").textContent = `generating… ${msg.chars.toLocaleString()} chars · ${msg.seconds}s`;
        } else if (msg.phase === "error") {
          errMsg = msg.error;
        } else if (msg.phase === "done") {
          html = msg.html;
        }
      }
    }
    if (errMsg && !html) throw new Error(errMsg);
    lastDeck = html; lastBrief = $("prompt").value; pushHistory(html);
    $("stage").srcdoc = html;
    $("placeholder").style.display = "none";
    $("toolbar").style.display = "flex";
    $("download").style.display = "inline-block";
    $("open").style.display = "inline-block";
    $("status").textContent = "done — arrows to navigate the deck";
  } catch (e) {
    if (e.name === "AbortError") $("status").textContent = "cancelled";
    else $("error").textContent = (e.name === "TimeoutError" ? "connection timed out — provider too slow or unreachable. Try a smaller brief, faster model, or cancel & retry." : (e.message || "network error"));
  } finally {
    loading(false); ctrl = null;
  }
});
let lastDeck = null;
$("download").addEventListener("click", () => {
  if (!lastDeck) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lastDeck], { type: "text/html" }));
  a.download = "deck.html"; a.click();
});
$("open").addEventListener("click", () => {
  if (!lastDeck) { $("error").textContent = "generate or load a deck first"; return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lastDeck], { type: "text/html" }));
  a.target = "_blank";
  a.rel = "noopener";
  a.click();
});


// ─── history (localStorage, per browser) ─────────────────────────────
const HISTORY_KEY = "slidegen-history";
const HISTORY_MAX = 15;
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch { return []; } }
function saveHistory(h) { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }
function deckTitle(html) {
  try {
    const d = new DOMParser().parseFromString(html, "text/html");
    return (d.querySelector("section h1,section h2,section h3")?.textContent || "").trim().slice(0, 54)
      || (d.querySelector("h1,h2,h3")?.textContent || "").trim().slice(0, 54)
      || "(untitled)";
  } catch { return "(untitled)"; }
}
function pushHistory(html) {
  if (!html) return;
  const h = loadHistory();
  h.unshift({ ts: Date.now(), title: deckTitle(html), html });
  saveHistory(h.slice(0, HISTORY_MAX));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  $("histList").innerHTML = h.map((e, i) =>
    `<option value="${i}">${new Date(e.ts).toLocaleString()} — ${e.title}</option>`).join("");
  $("histList").selectedIndex = -1;
}
$("histOpen").addEventListener("click", () => {
  const i = +$("histList").value;
  const h = loadHistory();
  if (!h[i]) { $("error").textContent = "select a history item first"; return; }
  lastDeck = h[i].html;
  lastBrief = "";
  $("stage").srcdoc = lastDeck;
  $("placeholder").style.display = "none";
  $("toolbar").style.display = "flex";
  $("download").style.display = "inline-block";
  $("open").style.display = "inline-block";
  $("filmstrip").style.display = $("editMode").checked ? "block" : "none";
  refreshStrip();
  $("status").textContent = "loaded from history — ✎ fix works here too (brief context empty)";
});
$("histDel").addEventListener("click", () => {
  const i = +$("histList").value;
  const h = loadHistory();
  if (!h[i]) return;
  h.splice(i, 1);
  saveHistory(h);
  renderHistory();
});
renderHistory();

// ─── slide editing ─────────
// ─── slide editing ─────────────────────────────────────────────────────
const STRIP = $("filmstrip");
const editModeBox = $("editMode");
const presetSel = $("preset");
const modelInput = $("model");
let lastBrief = "";

editModeBox.addEventListener("change", () => {
  STRIP.style.display = editModeBox.checked ? "block" : "none";
  if (editModeBox.checked) refreshStrip();
});

function parseSlides() {
  const doc = new DOMParser().parseFromString(lastDeck, "text/html");
  const secs = [...doc.querySelectorAll("section")].filter((s) => (s.className || "").includes("slide"));
  return { doc, secs };
}

function saveDeckFromDoc(doc) {
  lastDeck = "<!doctype html>\n" + doc.documentElement.outerHTML;
  $("stage").srcdoc = lastDeck;
  refreshStrip();
  $("status").textContent = "";
}

async function callEdit(slides, index, action, instruction) {
  const r = await fetch("/edit", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      prompt: lastBrief, preset: presetSel.value,
      provider: { ...providerPayload(), model: modelInput.value.trim() },
      slides, index, action, instruction,
    }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d.section;
}

function refreshStrip() {
  if (!lastDeck) return;
  const { doc, secs } = parseSlides();
  STRIP.innerHTML = "";
  secs.forEach((s, i) => {
    const title = (s.querySelector("h1,h2,h3,h4,[class*=title]")?.textContent || "").trim().slice(0, 38);
    const card = document.createElement("div");
    card.style.cssText = "border:1px solid #2a2f38;border-radius:8px;padding:6px;margin-bottom:8px;";
    card.innerHTML = `
      <div style="font-size:11px;color:#8b93a1;">slide ${i + 1} · ${title}</div>
      <iframe class="thumb" style="width:100%;aspect-ratio:16/9;border:0;background:#fff;pointer-events:none;" title="thumb ${i + 1}"></iframe>
      <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;">
        <button data-act="regen" style="font-size:11px;padding:4px 8px;">✎ fix</button>
        <button data-act="ins_before" style="font-size:11px;padding:4px 8px;">＋ before</button>
        <button data-act="ins_after" style="font-size:11px;padding:4px 8px;">＋ after</button>
        <button data-act="del" style="font-size:11px;padding:4px 8px;">🗑</button>
        <button data-act="up" style="font-size:11px;padding:4px 8px;">↑</button>
        <button data-act="down" style="font-size:11px;padding:4px 8px;">↓</button>
      </div>
      <input data-instruction placeholder="instruction for fix / insert…" style="margin-top:4px;width:96%;font-size:12px;background:#161b22;color:#f2ede4;border:1px solid #2a2f38;border-radius:6px;padding:4px 8px;">`;
    STRIP.appendChild(card);
    const thumbDoc = doc.documentElement.cloneNode(true);
    const all = [...thumbDoc.querySelectorAll("section")];
    let kept = 0;
    all.forEach((n, j) => { if (j === i) kept++; else n.remove(); });
    [...thumbDoc.querySelectorAll("script")].forEach((n) => n.remove());
    card.querySelector(".thumb").srcdoc = `<!doctype html>${thumbDoc.outerHTML}`;
    card.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => stripAction(card, i, b.dataset.act)));
  });
}

async function stripAction(card, i, act) {
  const instruction = card.querySelector("input[data-instruction]").value.trim();
  const { doc, secs } = parseSlides();

  if (act === "del") {
    if (!confirm(`Delete slide ${i + 1}?`)) return;
    secs[i].remove();
    return saveDeckFromDoc(doc);
  }
  if (act === "up" || act === "down") {
    const j = act === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= secs.length) return;
    const order = secs.map((s) => s.cloneNode(true));
    const moved = order.splice(i, 1)[0];
    order.splice(j, 0, moved);
    secs[0].parentNode.replaceChildren(...order);
    return saveDeckFromDoc(doc);
  }

  if (!instruction) { $("error").textContent = "type an instruction for this slide first"; return; }
  const btns = card.querySelectorAll("button");
  btns.forEach((b) => (b.disabled = true));
  $("status").textContent = "editing slide…";
  try {
    const section = await callEdit(secs.map((s) => s.outerHTML), i, act, instruction);
    const tpl = document.createElement("template");
    tpl.innerHTML = section;
    const clean = tpl.content.querySelector("section");
    if (!clean) throw new Error("no <section> in model output. Raw: " + section.slice(0, 200));
    if (act === "regen") secs[i].replaceWith(clean);
    else if (act === "ins_before") secs[i].before(clean);
    else secs[i].after(clean);
    saveDeckFromDoc(doc);
    $("status").textContent = "slide updated";
  } catch (e) {
    $("status").textContent = "";
    $("error").textContent = e.message || String(e);
  } finally {
    btns.forEach((b) => (b.disabled = false));
  }
}
</script>
</body>
</html>
