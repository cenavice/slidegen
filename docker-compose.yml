services:
  slidegen:
    build: .
    volumes: ["./public:/app/public", "./output:/app/output"]
    ports: ["3000:3000"]
    environment:
      SLIDEGEN_API_KEY: ${SLIDEGEN_API_KEY}
      SLIDEGEN_MODEL: ${SLIDEGEN_MODEL:-gpt-4o-mini}
      SLIDEGEN_BASE_URL: ${SLIDEGEN_BASE_URL:-https://api.openai.com/v1}
